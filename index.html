<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0a">
    <title>Cyber Tuning Fork - Pythagorean Synthesizer</title>
    
    <!-- Critical Resource Preloading -->
    <link rel="preload" as="image" href="CyberTuningFork.webp?v=20250912" fetchpriority="high">
    
    <!-- PWA Configuration -->
    <link rel="manifest" href="manifest.json">
    
    <!-- iOS Specific Meta Tags for PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Gravitonic">
    <link rel="apple-touch-icon" href="app-icon-180.png">
    <link rel="apple-touch-icon" sizes="180x180" href="app-icon-180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="app-icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="app-icon-512.png">
    
    <!-- Additional iOS PWA meta tags -->
    <meta name="apple-touch-fullscreen" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    
    <link rel="stylesheet" href="style.css?v=20250929-audio-v10">
</head>
<body>
    <div class="app-container">
        <!-- Status/Info Message -->
        <div id="status-message" class="status-message hidden" role="alert" aria-live="polite"></div>
        
        <!-- Mobile Audio Notice -->
        <div id="audio-notice" class="audio-notice hidden">
            <span class="audio-icon">🔊</span>
            <span>Sound On</span>
        </div>
        
        <!-- Loading Sound Animation -->
        <div id="loading-sound" class="loading-sound-container hidden">
            <div class="loading-sound-indicator">
                <span class="sound-icon">🎵</span>
                <span class="loading-text">Loading Sound</span>
                <div class="loading-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>
        
        
        <!-- Navigation Header -->
        <div class="navigation-header">
            <button id="bridge-nav-button" class="nav-button bridge-button" aria-label="Open Resonant Bridge mode">
                <span class="bridge-symbol">Ξ</span>
                <span class="bridge-label">Resonant Bridge</span>
            </button>
            <h1 class="app-title">Cyber Tuning Fork</h1>
        </div>
        
        <!-- Main Tuning Fork Screen -->
        <div id="main-screen" class="main-screen">
            <!-- Top: Zodiac Wheel -->
        <div class="zodiac-section">

            <!-- Mobile-only gain slider (left, paired with vibrato) -->
            <div class="zodiac-side-slider zodiac-side-gain" aria-label="Gain control">
                <span class="side-slider-label">GAIN</span>
                <input type="range" id="mobile-gain-slider" class="side-slider-input" min="0" max="100" value="100" orient="vertical" aria-label="Output gain 0 to 100 percent">
                <span id="mobile-gain-display" class="side-slider-value">100%</span>
            </div>

            <svg class="zodiac-wheel" viewBox="0 0 400 400" aria-label="Zodiac wheel for tonic selection">
                <g id="zodiac-segments">
                    <!-- Segments will be generated by JS -->
                </g>
                <circle cx="200" cy="200" r="80" fill="none" stroke="rgba(255, 215, 0, 0.3)" stroke-width="2"/>
                <text x="200" y="210" text-anchor="middle" class="zodiac-center-text" aria-hidden="true">TONIC</text>
            </svg>
            <!-- Mobile-only vibrato slider (right of wheel) -->
            <div class="zodiac-side-slider zodiac-side-vibrato" aria-label="Vibrato control">
                <span class="side-slider-label">VIB</span>
                <input type="range" id="mobile-vibrato-slider" class="side-slider-input" min="0" max="100" value="0" orient="vertical" aria-label="Vibrato intensity 0 to 100 percent">
                <span id="mobile-vibrato-display" class="side-slider-value">0%</span>
            </div>

        </div>

        <!-- Black Hole Portal (Hidden Easter Egg) -->
        <div id="black-hole-portal" class="black-hole-portal hidden">
            <div class="portal-container">
                <div class="event-horizon"></div>
                <div class="accretion-disk"></div>
                <div class="gravitational-lensing"></div>
                <div class="hawking-radiation"></div>
            </div>
        </div>

        <!-- Middle: Cyber Tuning Fork with Visualizer -->
        <div class="fork-section">
            <div class="fork-container">
                <img id="fork-image" alt="Cyber Tuning Fork" class="fork-image" width="800" height="800" style="pointer-events: none;">
                <canvas id="visualizer-canvas" class="visualizer-canvas" aria-hidden="true"></canvas>
                <svg class="fork-fallback hidden" viewBox="0 0 200 300" aria-label="Tuning Fork">
                    <g stroke="#b0b0b0" stroke-width="3" fill="none">
                        <!-- Fork prongs -->
                        <line x1="80" y1="50" x2="80" y2="150"/>
                        <line x1="120" y1="50" x2="120" y2="150"/>
                        <!-- Fork base -->
                        <line x1="80" y1="150" x2="120" y2="150"/>
                        <line x1="100" y1="150" x2="100" y2="250"/>
                        <!-- Handle -->
                        <rect x="95" y="250" width="10" height="30" fill="#b0b0b0"/>
                    </g>
                    <!-- Visualizer circle between prongs -->
                    <circle cx="100" cy="100" r="15" fill="none" stroke="rgba(255, 215, 0, 0.5)" stroke-width="2" class="fork-viz-circle"/>
                </svg>
            </div>
        </div>

        <!-- Bottom: Scale Bar -->
        <div class="scale-section">
            <svg class="scale-bar" viewBox="0 0 600 120" aria-label="Pythagorean scale bar">
                <defs>
                    <linearGradient id="scaleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#ffd700;stop-opacity:0.3"/>
                        <stop offset="50%" style="stop-color:#ffd700;stop-opacity:0.6"/>
                        <stop offset="100%" style="stop-color:#ffd700;stop-opacity:0.3"/>
                    </linearGradient>
                </defs>
                <line x1="50" y1="60" x2="550" y2="60" stroke="url(#scaleGradient)" stroke-width="4"/>
                <g id="scale-nodes">
                    <!-- Nodes will be generated by JS -->
                </g>
            </svg>
        </div>

        <!-- Controls -->
        <div class="controls-section">
            <div class="control-row-top">
                <label class="mode-picker" aria-label="Musical mode">
                    <select id="mode-select" class="mode-select">
                        <option value="ionian">Ionian</option>
                        <option value="dorian">Dorian</option>
                        <option value="phrygian">Phrygian</option>
                        <option value="lydian">Lydian</option>
                        <option value="mixolydian">Mixolydian</option>
                        <option value="aeolian" selected>Aeolian</option>
                        <option value="locrian">Locrian</option>
                    </select>
                </label>
                
                <div class="readout" aria-live="polite">
                    <span id="key-display">C</span> • <span id="mode-display">Aeolian</span> • <span id="freq-display">440</span> Hz
                </div>
                
                <div class="octave-controls">
                    <button id="octave-down" class="control-button" aria-label="Lower octave">−</button>
                    <button id="octave-up" class="control-button" aria-label="Raise octave">+</button>
                </div>
            </div>
            
            <div class="control-row-middle">
                <div class="vibrato-control">
                    <label for="vibrato-slider" class="vibrato-label">Vibrato</label>
                    <input type="range" id="vibrato-slider" class="vibrato-slider" min="0" max="100" value="0" aria-label="Vibrato intensity from 0 to 100 percent">
                    <span id="vibrato-display" class="vibrato-display">0%</span>
                </div>
            </div>
            
            <div class="control-row-bottom">
                <button id="record-button" class="control-button record-button" aria-label="Start recording">REC</button>
                <button id="stop-button" class="control-button stop-button" disabled aria-label="Stop recording">STOP</button>
                <button id="export-midi" class="control-button export-button" disabled aria-label="Export as MIDI">Export MIDI</button>
            </div>
        </div>
        </div>
        
        <!-- Bridge Screen (Modal) -->
        <div id="bridge-screen" class="bridge-screen hidden">
            <div class="bridge-container">
                <!-- Bridge Header -->
                <div class="bridge-header">
                    <button id="bridge-close-button" class="nav-button close-button" aria-label="Close Bridge mode">
                        <span>×</span>
                    </button>
                    <h2 class="bridge-title">Resonant Bridge (Ξ)</h2>
                </div>
                
                <!-- Quantized Tonic Display -->
                <div class="bridge-tonic-section">
                    <div class="tonic-display">
                        <h3>Quantized Tonic (from first number)</h3>
                        <div class="tonic-info">
                            <span id="quantized-tonic" class="tonic-note">C</span>
                            <span id="tonic-ratio" class="tonic-ratio">1/1</span>
                        </div>
                    </div>
                </div>
                
                <!-- Input Sections A & B -->
                <div class="bridge-inputs">
                    <div class="input-section input-a">
                        <h3>Input A</h3>
                        <div class="input-content">
                            <input type="text" id="input-a-number" class="bridge-input" placeholder="Enter number or letters..." value="1" inputmode="text" autocapitalize="none" spellcheck="false">
                        </div>
                        <div class="input-results">
                            <div class="result-line">Δc: <span id="delta-a">+0¢</span></div>
                            <div class="result-line">Quad: <span id="quad-a" class="quad-symbol">Ⓢ</span></div>
                        </div>
                    </div>
                    
                    <div class="input-section input-b">
                        <h3>Input B</h3>
                        <div class="input-content">
                            <input type="text" id="input-b-number" class="bridge-input" placeholder="Enter number or letters..." value="2" inputmode="text" autocapitalize="none" spellcheck="false">
                        </div>
                        <div class="input-results">
                            <div class="result-line">Δc: <span id="delta-b">+0¢</span></div>
                            <div class="result-line">Quad: <span id="quad-b" class="quad-symbol">Ⓢ</span></div>
                        </div>
                    </div>
                </div>
                
                <!-- Resonance Compass -->
                <div class="resonance-compass">
                    <h3>Resonance Compass</h3>
                    <svg class="compass-plot" viewBox="0 0 200 200" aria-label="Resonance quadrant plot">
                        <defs>
                            <linearGradient id="compassGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#ffd700;stop-opacity:0.1"/>
                                <stop offset="100%" style="stop-color:#ffd700;stop-opacity:0.3"/>
                            </linearGradient>
                        </defs>
                        <!-- Quadrant background -->
                        <rect x="10" y="10" width="180" height="180" fill="url(#compassGradient)" stroke="rgba(255, 215, 0, 0.3)" stroke-width="1"/>
                        <!-- Axes -->
                        <line x1="100" y1="10" x2="100" y2="190" stroke="rgba(255, 215, 0, 0.5)" stroke-width="1"/>
                        <line x1="10" y1="100" x2="190" y2="100" stroke="rgba(255, 215, 0, 0.5)" stroke-width="1"/>
                        <!-- Quadrant labels -->
                        <text x="55" y="55" text-anchor="middle" class="quad-label">Ⓢ</text>
                        <text x="145" y="55" text-anchor="middle" class="quad-label">Ⓒ</text>
                        <text x="55" y="145" text-anchor="middle" class="quad-label">Ⓦ</text>
                        <text x="145" y="145" text-anchor="middle" class="quad-label">Ⓐ</text>
                        <!-- Points A and B -->
                        <circle id="point-a" cx="75" cy="75" r="4" fill="#ff6b6b" stroke="#fff" stroke-width="1"/>
                        <circle id="point-b" cx="125" cy="125" r="4" fill="#4ecdc4" stroke="#fff" stroke-width="1"/>
                    </svg>
                </div>
                
                <!-- Play Controls -->
                <div class="bridge-controls">
                    <div class="play-buttons">
                        <button id="play-a" class="bridge-play-button play-a-button" aria-label="Play Input A">
                            <span class="play-symbol">▶︎</span> Play A
                        </button>
                        <button id="play-b" class="bridge-play-button play-b-button" aria-label="Play Input B">
                            <span class="play-symbol">▶︎</span> Play B
                        </button>
                        <button id="play-bridge" class="bridge-play-button play-bridge-button" aria-label="Play Bridge Cross-Resonance">
                            <span class="bridge-symbol">Ξ</span> Bridge
                        </button>
                    </div>
                    
                    <!-- Shared Controls (reuse vibrato) -->
                    <div class="bridge-shared-controls">
                        <!-- Manual effects controls removed - effects now driven by quadrants + axes only -->
                    </div>
                </div>
                
            </div>
        </div>
        
    </div>

    <!-- Production-ready PWA service worker -->
    <script>
        console.log('✅ HTML loaded - setting up PWA');
        
        // One-time migration cleanup (remove after users migrate)
        const MIGRATION_KEY = 'cyber-tuning-fork-migrated-v2';
        if (!localStorage.getItem(MIGRATION_KEY)) {
            console.log('Running one-time migration cleanup');
            
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(registrations => {
                    // Only unregister old workers, not our new one
                    registrations.forEach(reg => {
                        if (!reg.active || !reg.active.scriptURL.includes('sw.js')) {
                            reg.unregister();
                            console.log('Unregistered legacy SW');
                        }
                    });
                });
                
                if (window.caches) {
                    caches.keys().then(cacheNames => {
                        // Only clear old cache versions
                        cacheNames.forEach(name => {
                            if (name.includes('cyber-tuning-fork') && !name.includes('v2025-09-10')) {
                                caches.delete(name);
                                console.log('Cleared legacy cache:', name);
                            }
                        });
                    });
                }
            }
            
            localStorage.setItem(MIGRATION_KEY, 'true');
        }
        
        // Register production service worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('Production SW registered');
                        
                        // Handle updates
                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    console.log('New version available - refresh to update');
                                }
                            });
                        });
                    })
                    .catch(err => console.error('SW registration failed:', err));
            });
        }
    </script>
    
    <script type="module" src="main.js?v=20250929-audio-v10" onerror="console.error('Failed to load main.js')"></script>
</body>
</html>
